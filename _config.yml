url: "https://kckhchen.com"
baseurl: "/blog"

title: Casey Chen
description: Follow my journey on learning new things.
lang: zh-TW

author:
  name: "Casey Chen"
  url: "https://khkhchen.com"
email: kc.khchen@gmail.com
github_username: kckhchen

rss: RSS
show_excerpts: true
permalink: /:title/
timezone: Asia/Taipei


theme: minima
plugins:
  - jekyll-feed
  - jekyll-toc
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-last-modified-at

paginate: 10
paginate_path: "/page:num/"

defaults:
  - scope: { path: "", type: posts }
    values:
      toc: true
      author: "Casey Chen"
