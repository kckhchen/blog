<script>
  document
    .querySelectorAll(".post-content .highlighter-rouge > .highlight")
    .forEach((block) => {
      const button = document.createElement("button");
      button.className = "copy-code-btn";
      button.setAttribute("aria-label", "Copy code");
      button.innerHTML =
        '<svg class="icon-copy" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 0 1-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 0 1 1.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 0 0-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 0 1-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 0 0-3.375-3.375h-1.5a1.125 1.125 0 0 1-1.125-1.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H9.75"/></svg>' +
        '<svg class="icon-check hidden" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>';

      const showCopied = () => {
        button.querySelector(".icon-copy").classList.add("hidden");
        button.querySelector(".icon-check").classList.remove("hidden");
        setTimeout(() => {
          button.querySelector(".icon-copy").classList.remove("hidden");
          button.querySelector(".icon-check").classList.add("hidden");
        }, 2000);
      };

      // textarea + execCommand fallback for contexts where the async
      // Clipboard API is unavailable or denied
      const fallbackCopy = (text) => {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        let ok = false;
        try {
          ok = document.execCommand("copy");
        } catch (e) {}
        ta.remove();
        if (ok) showCopied();
      };

      button.addEventListener("click", () => {
        const code = block.querySelector("pre");
        if (!code) return;
        const text = code.innerText;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard
            .writeText(text)
            .then(showCopied, () => fallbackCopy(text));
        } else {
          fallbackCopy(text);
        }
      });

      block.appendChild(button);
    });
</script>
