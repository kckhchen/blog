<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "TechArticle",
        "@id": "{{ page.url | absolute_url }}#article",
        "headline": {{ page.title | jsonify }},
        "description": {{ page.description | default: page.excerpt | strip_html | truncate: 160 | jsonify }},
        "datePublished": "{{ page.date | date_to_xmlschema }}",
        "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
        "inLanguage": "zh-TW",
        "author": { "@id": "{{ site.url }}#person" },
        "publisher": { "@id": "{{ site.url }}#person" },
        "mainEntityOfPage": { "@id": "{{ page.url | absolute_url }}" },
        {% if page.tags %}"keywords": {{ page.tags | join: ", " | jsonify }},{% endif %}
        "image": {{ page.image | default: "/assets/og/default.png" | absolute_url | jsonify }}
      },
      {
        "@type": "Person",
        "@id": "{{ site.url }}#person",
        "name": "Casey Chen",
        "url": "{{ site.url }}",
        "sameAs": [
          "https://github.com/kckhchen",
        ],
        "knowsAbout": ["Python", "Jekyll", "Obsidian", "SaaS"]
      },
      {
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "首頁", "item": "{{ site.url }}" },
          { "@type": "ListItem", "position": 2, "name": {{ page.categories.first | default: "文章" | jsonify }}, "item": "{{ site.url }}/{{ page.categories.first }}/" },
          { "@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }} }
        ]
      }
    ]
  }
</script>
