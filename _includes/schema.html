{%- assign is_post = page.layout == 'post' -%}
{%- assign desc = page.description | default: page.excerpt | strip_html | strip_newlines | truncate: 160 -%}

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {%- if is_post %}
    {
      "@type": "TechArticle",
      "@id": "{{ page.url | absolute_url }}#article",
      "headline": {{ page.title | jsonify }},
      "description": {{ desc | jsonify }},
      "datePublished": "{{ page.date | date_to_xmlschema }}",
      "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
      "author": { "@id": "https://kckhchen.com/#person" },
      "publisher": { "@id": "https://kckhchen.com/#person" },
      "mainEntityOfPage": { "@id": "{{ page.url | absolute_url }}" },
      {%- if page.tags %}
      "keywords": {{ page.tags | join: ", " | jsonify }},
      {%- endif %}
      {%- if page.image %}
      "image": {{ page.image | default: "/assets/og/default.png" | absolute_url | jsonify }},
      {%- endif %}
      "inLanguage": "zh-TW"
    },
    {%- endif %}
    {%- if is_post %}
    {
      "@type": "BreadcrumbList",
      "@id": "{{ page.url | absolute_url }}#breadcrumb",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "首頁", "item": "https://kckhchen.com/" },
        { "@type": "ListItem", "position": 2, "name": "Blog", "item": "{{ '/' | absolute_url }}" },
        { "@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }} }
      ]
    },
    {%- endif %}
    {
      "@type": "Person",
      "@id": "https://kckhchen.com/#person",
      "name": "Casey Chen",
      "url": "https://kckhchen.com/",
      "sameAs": [
        "https://github.com/kckhchen"
      ],
      "knowsAbout": ["Python", "Jekyll", "Obsidian", "Ruby", "GitHub", "SaaS"]
    }
  ]
}
</script>
